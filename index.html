/* === Services === */
.ev-services-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 24px;
  background: transparent;
}
.ev-service-card {

.ev-service-card:nth-child(1) { grid-column: 1 / 3; }
.ev-service-card:nth-child(2) { grid-column: 3 / 5; }
.ev-service-card:nth-child(3) { grid-column: 5 / 7; }
.ev-service-card:nth-child(4) { grid-column: 1 / 4; }
.ev-service-card:nth-child(5) { grid-column: 4 / 7; }

/* Shimmer effect on hover */
.ev-service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.05),
    transparent
  );
  transition: left 0.6s ease;
  pointer-events: none;
}
.ev-service-card:hover::before {
  left: 100%;
}

/* Glow effect on hover */
.ev-service-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid transparent;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  pointer-events: none;
  border-radius: 4px;
}
.ev-service-card:hover::after {
  border-color: rgba(236, 102, 36, 0.4);
  box-shadow:
    0 0 30px rgba(236, 102, 36, 0.15),
    0 0 60px rgba(236, 102, 36, 0.08) inset;
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  const dismiss = () => setOpen(false);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button">{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakSlider, TweakToggle, TweakRadio });
</script>

function Contact({ t }) {
  const f = t.contact.fields;
  const [vals, setVals] = React.useState({
    name: "", company: "", email: "", phone: "",
    interest: "", message: "", budget: "", timeline: "", haveData: "", notes: ""
  });
  const [errors, setErrors] = React.useState({});
  const [status, setStatus] = React.useState("idle");

  const update = (k, v) => {
    setVals((s) => ({ ...s, [k]: v }));
    if (errors[k]) setErrors((e) => { const n = { ...e }; delete n[k]; return n; });
  };

  const validate = () => {
    const e = {};
    if (!vals.name.trim()) e.name = f.required;
    if (!vals.email.trim()) e.email = f.required;
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email)) e.email = f.invalidEmail;
    if (!vals.message.trim()) e.message = f.required;
    return e;
  };

  const submit = (ev) => {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    setStatus("sending");
    setTimeout(() => setStatus("sent"), 900);
  };

  if (status === "sent") {
    return (

              </li>
              <li>
                <span className="ev-meta-l">LOCATION</span>

                  <span>Taipei, Taiwan</span>
                  <br />
                  <span>14 F.-1 NO.415, Sec.4 Xinyi RD., Xinyi Dist</span>
                </span>
              </li>
              <li>
                <span className="ev-meta-l"></span>
                <span className="ev-meta-v">≤ 2 business days</span>
              </li>
            </ul>
          </div>
          <form className="ev-form" onSubmit={submit} noValidate>
            <div className="ev-form-row two">
              <Field label={f.name} required err={errors.name}>
                <input type="text" value={vals.name} onChange={(e) => update("name", e.target.value)} />
              </Field>
              <Field label={f.company}>
                <input type="text" value={vals.company} onChange={(e) => update("company", e.target.value)} />
              </Field>
            </div>
            <div className="ev-form-row two">
              <Field label={f.email} required err={errors.email}>
                <input type="email" value={vals.email} onChange={(e) => update("email", e.target.value)} />
              </Field>
              <Field label={f.phone}>
                <input type="tel" value={vals.phone} onChange={(e) => update("phone", e.target.value)} />
              </Field>
            </div>
            <Field label={f.interest}>

                <option value="">—</option>
                {t.contact.interestOptions.map((o) => <option key={o} value={o}>{o}</option>)}

            <Field label={f.message} required err={errors.message}>

            <details className="ev-form-more">

                      <input type="radio" name="haveData" value={o} checked={vals.haveData === o} onChange={(e) => update("haveData", e.target.value)} />
                      <span>{o}</span>
                    </label>
                  ))}
                </div>
              </Field>
              <Field label={f.notes}>
                <textarea rows="3" value={vals.notes} onChange={(e) => update("notes", e.target.value)} />

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "accent": "mono",
  "typography": "inter",
  "lang": "en"
};

const ACCENTS = {
  mono:    { bg: "#08090b", bg2: "#0d0f12", bg3: "#14171c", fg: "#f5f5f4", line: "rgba(255,255,255,0.08)", line2: "rgba(255,255,255,0.14)" },
  glacier: { bg: "#06090f", bg2: "#0b1018", bg3: "#11192a", fg: "#e6f0ff", line: "rgba(160,200,255,0.10)", line2: "rgba(160,200,255,0.18)" },
  carbon:  { bg: "#0a0a0a", bg2: "#121212", bg3: "#1a1a1a", fg: "#fafafa", line: "rgba(255,255,255,0.07)", line2: "rgba(255,255,255,0.12)" },
  warm:    { bg: "#0c0a08", bg2: "#13110e", bg3: "#1b1814", fg: "#f5efe6", line: "rgba(245,239,230,0.08)", line2: "rgba(245,239,230,0.14)" },
};

function applyAccent(name) {
  const a = ACCENTS[name] || ACCENTS.mono;
  const r = document.documentElement;
  r.style.setProperty("--ev-bg", a.bg);
  r.style.setProperty("--ev-bg-2", a.bg2);
  r.style.setProperty("--ev-bg-3", a.bg3);
  r.style.setProperty("--ev-fg", a.fg);
  r.style.setProperty("--ev-line", a.line);
  r.style.setProperty("--ev-line-2", a.line2);
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const lang = tweaks.lang || "en";
  const t = window.I18N[lang];

  React.useEffect(() => { applyAccent(tweaks.accent); }, [tweaks.accent]);
  React.useEffect(() => { document.body.dataset.typo = tweaks.typography; }, [tweaks.typography]);
  React.useEffect(() => { document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en"; }, [lang]);

  const scrollTo = (id) => {
    if (id === 'contact') {
      window.location.href = 'contact.html';
    } else {
      const el = document.getElementById(id);
      if (el) {
        const y = el.getBoundingClientRect().top + window.scrollY - 60;
        window.scrollTo({ top: y, behavior: "smooth" });
      }
    }
  };

  return (
    <React.Fragment>
      <Nav t={t} lang={lang} onLang={(l) => setTweak("lang", l)} onScrollTo={scrollTo} />
      <main style={{ position: 'relative', zIndex: 1 }}>

        <Process t={t} />
        <Why t={t} />
      </main>
      <Footer t={t} />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Accent">
          <TweakRadio
            value={tweaks.accent}
            onChange={(v) => setTweak("accent", v)}
            options={[
              { value: "mono", label: "Mono" },
              { value: "carbon", label: "Carbon" },
              { value: "glacier", label: "Glacier" },
              { value: "warm", label: "Warm" },
            ]}
          />
        </TweakSection>

        <TweakSection title="Typography">
          <TweakRadio
            value={tweaks.typography}
            onChange={(v) => setTweak("typography", v)}
            options={[
              { value: "inter", label: "Inter" },
              { value: "grotesk", label: "Grotesk" },
              { value: "serif", label: "Serif" },
              { value: "mono", label: "Mono" },
            ]}
          />
        </TweakSection>

        <TweakSection title="Language">
          <TweakRadio
            value={lang}
            onChange={(v) => setTweak("lang", v)}
            options={[
              { value: "en", label: "English" },
              { value: "zh", label: "中文" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
